version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      lint-test:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "@axe-core/*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
