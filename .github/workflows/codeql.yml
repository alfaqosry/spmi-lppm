name: CodeQL

# SAST (ISO/IEC 27034 ASC "analisis kode statis"; ISO/IEC 27001 A.8.25/A.8.28/A.8.29).
# Lihat docs/iso/27034-KEAMANAN-APLIKASI.md.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Senin 02:23 UTC (09:23 WIB) — menangkap kueri CodeQL baru walau kode tidak berubah.
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # wajib untuk repo privat (status workflow run)
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # JS/TS dianalisis langsung dari sumber; tidak perlu build.
          build-mode: none
          queries: security-extended

      # Repo privat: unggah ke tab Security butuh GitHub Advanced Security (berbayar).
      # Default "never" -> hasil disimpan sebagai artifact & dicek di langkah berikut.
      # Setelah Advanced Security aktif, set variabel repo CODEQL_UPLOAD=always.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: ${{ vars.CODEQL_UPLOAD || 'never' }}
          output: codeql-results

      - name: Simpan hasil SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30

      - name: Gagal bila ada temuan keamanan
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "codeql-results";
            let n = 0;
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const run of sarif.runs || []) {
                for (const r of run.results || []) {
                  if (r.level === "note" || r.suppressions?.length) continue;
                  n++;
                  const loc = r.locations?.[0]?.physicalLocation;
                  console.log(`::error file=${loc?.artifactLocation?.uri},line=${loc?.region?.startLine}::${r.ruleId}: ${r.message?.text}`);
                }
              }
            }
            console.log(`Temuan CodeQL (warning/error): ${n}`);
            process.exit(n > 0 ? 1 : 0);
          '
