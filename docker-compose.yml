services:
  mysql:
    image: mysql:8
    container_name: lpm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lpm_spmi
    ports:
      - "3307:3306"
    volumes:
      - lpm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lpm_mysql_data:
